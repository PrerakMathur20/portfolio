<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" fill="none">
  <style>
    .screen-glow { animation: screenPulse 3s ease-in-out infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .code-line1 { animation: typeLine 4s ease-out infinite; transform-origin: left center; }
    .code-line2 { animation: typeLine 4s ease-out 0.6s infinite; transform-origin: left center; }
    .code-line3 { animation: typeLine 4s ease-out 1.2s infinite; transform-origin: left center; }
    .code-line4 { animation: typeLine 4s ease-out 1.8s infinite; transform-origin: left center; }
    .code-line5 { animation: typeLine 4s ease-out 2.4s infinite; transform-origin: left center; }
    .float { animation: float 4s ease-in-out infinite; }
    .tag1 { animation: fadeTag 6s ease-in-out infinite; }
    .tag2 { animation: fadeTag 6s ease-in-out 2s infinite; }
    .tag3 { animation: fadeTag 6s ease-in-out 4s infinite; }
    .particle1 { animation: particle 5s ease-in-out infinite; }
    .particle2 { animation: particle 5s ease-in-out 1.5s infinite; }
    .particle3 { animation: particle 5s ease-in-out 3s infinite; }
    @keyframes screenPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes typeLine {
      0% { clip-path: inset(0 100% 0 0); opacity: 0; }
      5% { opacity: 1; }
      20%, 70% { clip-path: inset(0 0% 0 0); opacity: 1; }
      85%, 100% { clip-path: inset(0 0% 0 0); opacity: 0.6; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes fadeTag {
      0%, 100% { opacity: 0; transform: translateY(4px); }
      20%, 70% { opacity: 1; transform: translateY(0); }
    }
    @keyframes particle {
      0% { opacity: 0; transform: translate(0, 0) scale(0); }
      20% { opacity: 0.8; transform: translate(-10px, -20px) scale(1); }
      60% { opacity: 0.4; transform: translate(-20px, -50px) scale(0.8); }
      100% { opacity: 0; transform: translate(-15px, -80px) scale(0.2); }
    }
  </style>

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a5c"/>
      <stop offset="100%" stop-color="#252540"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c6bc0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#26c6da" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="540" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient glow behind monitor -->
  <ellipse cx="240" cy="200" rx="160" ry="100" fill="url(#glowGrad)" class="screen-glow"/>

  <!-- Desk surface -->
  <rect x="40" y="360" width="400" height="18" rx="4" fill="url(#deskGrad)"/>
  <rect x="60" y="375" width="360" height="6" rx="2" fill="#1a1a2e" opacity="0.5"/>

  <!-- Monitor stand -->
  <rect x="215" y="330" width="50" height="35" rx="3" fill="#22223a"/>
  <rect x="185" y="358" width="110" height="8" rx="4" fill="#2a2a40"/>

  <!-- Monitor outer frame -->
  <rect x="80" y="80" width="320" height="255" rx="12" fill="#1a1a28" class="float"/>

  <!-- Monitor bezel -->
  <rect x="86" y="86" width="308" height="243" rx="9" fill="#111120"/>

  <!-- Screen area -->
  <rect x="92" y="92" width="296" height="228" rx="6" fill="url(#screenGrad)" class="screen-glow"/>

  <!-- Screen - editor UI -->
  <!-- Title bar -->
  <rect x="92" y="92" width="296" height="22" rx="6" fill="#0d0d1a"/>
  <rect x="92" y="104" width="296" height="10" fill="#0d0d1a"/>
  <!-- Traffic lights -->
  <circle cx="107" cy="103" r="4" fill="#ff5f57" opacity="0.9"/>
  <circle cx="121" cy="103" r="4" fill="#ffbd2e" opacity="0.9"/>
  <circle cx="135" cy="103" r="4" fill="#28c840" opacity="0.9"/>
  <!-- Filename tab -->
  <rect x="148" y="97" width="80" height="12" rx="3" fill="#1e1e3a"/>
  <text x="158" y="107" font-family="monospace" font-size="7" fill="#8892b0">App.tsx</text>

  <!-- Sidebar -->
  <rect x="92" y="114" width="32" height="206" fill="#0d0d20"/>
  <!-- Sidebar icons -->
  <rect x="100" y="122" width="16" height="14" rx="2" fill="#3a3a5c"/>
  <rect x="100" y="142" width="16" height="14" rx="2" fill="#252540"/>
  <rect x="100" y="162" width="16" height="14" rx="2" fill="#252540"/>
  <rect x="100" y="182" width="16" height="14" rx="2" fill="#252540"/>

  <!-- Code editor area -->
  <rect x="124" y="114" width="264" height="206" fill="#0f0f1e"/>

  <!-- Line numbers -->
  <rect x="124" y="114" width="20" height="206" fill="#0d0d1a" opacity="0.6"/>

  <!-- Code lines -->
  <!-- Line 1: import statement -->
  <g class="code-line1">
    <text x="148" y="130" font-family="monospace" font-size="7.5" fill="#c792ea">import</text>
    <text x="185" y="130" font-family="monospace" font-size="7.5" fill="#82aaff">React</text>
    <text x="210" y="130" font-family="monospace" font-size="7.5" fill="#89ddff">from</text>
    <text x="232" y="130" font-family="monospace" font-size="7.5" fill="#c3e88d">'react'</text>
    <text x="264" y="130" font-family="monospace" font-size="7.5" fill="#89ddff">;</text>
  </g>
  <!-- Line numbers -->
  <text x="128" y="130" font-family="monospace" font-size="6" fill="#3a3a5c">1</text>

  <!-- Line 2: blank -->
  <text x="128" y="142" font-family="monospace" font-size="6" fill="#3a3a5c">2</text>

  <!-- Line 3: const App -->
  <g class="code-line2">
    <text x="148" y="154" font-family="monospace" font-size="7.5" fill="#c792ea">const</text>
    <text x="179" y="154" font-family="monospace" font-size="7.5" fill="#82aaff">App</text>
    <text x="198" y="154" font-family="monospace" font-size="7.5" fill="#89ddff"> = ()</text>
    <text x="222" y="154" font-family="monospace" font-size="7.5" fill="#c792ea"> =&gt;</text>
    <text x="239" y="154" font-family="monospace" font-size="7.5" fill="#89ddff"> {"{" }</text>
  </g>
  <text x="128" y="154" font-family="monospace" font-size="6" fill="#3a3a5c">3</text>

  <!-- Line 4: return -->
  <g class="code-line3">
    <text x="156" y="166" font-family="monospace" font-size="7.5" fill="#c792ea">return</text>
    <text x="189" y="166" font-family="monospace" font-size="7.5" fill="#89ddff"> (</text>
  </g>
  <text x="128" y="166" font-family="monospace" font-size="6" fill="#3a3a5c">4</text>

  <!-- Line 5: JSX div -->
  <g class="code-line4">
    <text x="164" y="178" font-family="monospace" font-size="7.5" fill="#89ddff">&lt;</text>
    <text x="170" y="178" font-family="monospace" font-size="7.5" fill="#f07178">div</text>
    <text x="189" y="178" font-family="monospace" font-size="7.5" fill="#ffcb6b"> className</text>
    <text x="243" y="178" font-family="monospace" font-size="7.5" fill="#89ddff">=</text>
    <text x="249" y="178" font-family="monospace" font-size="7.5" fill="#c3e88d">"app"</text>
    <text x="276" y="178" font-family="monospace" font-size="7.5" fill="#89ddff">&gt;</text>
  </g>
  <text x="128" y="178" font-family="monospace" font-size="6" fill="#3a3a5c">5</text>

  <!-- Line 6: heading -->
  <g class="code-line5">
    <text x="172" y="190" font-family="monospace" font-size="7.5" fill="#89ddff">&lt;</text>
    <text x="178" y="190" font-family="monospace" font-size="7.5" fill="#f07178">h1</text>
    <text x="191" y="190" font-family="monospace" font-size="7.5" fill="#89ddff">&gt;</text>
    <text x="198" y="190" font-family="monospace" font-size="7.5" fill="#eeffff">Hello World</text>
    <text x="257" y="190" font-family="monospace" font-size="7.5" fill="#89ddff">&lt;/</text>
    <text x="268" y="190" font-family="monospace" font-size="7.5" fill="#f07178">h1</text>
    <text x="281" y="190" font-family="monospace" font-size="7.5" fill="#89ddff">&gt;</text>
  </g>
  <text x="128" y="190" font-family="monospace" font-size="6" fill="#3a3a5c">6</text>

  <!-- Remaining line numbers -->
  <text x="128" y="202" font-family="monospace" font-size="6" fill="#3a3a5c">7</text>
  <text x="128" y="214" font-family="monospace" font-size="6" fill="#3a3a5c">8</text>
  <text x="128" y="226" font-family="monospace" font-size="6" fill="#3a3a5c">9</text>
  <text x="124" y="238" font-family="monospace" font-size="6" fill="#3a3a5c">10</text>
  <text x="124" y="250" font-family="monospace" font-size="6" fill="#3a3a5c">11</text>
  <text x="124" y="262" font-family="monospace" font-size="6" fill="#3a3a5c">12</text>
  <text x="124" y="274" font-family="monospace" font-size="6" fill="#3a3a5c">13</text>
  <text x="124" y="286" font-family="monospace" font-size="6" fill="#3a3a5c">14</text>
  <text x="124" y="298" font-family="monospace" font-size="6" fill="#3a3a5c">15</text>
  <text x="124" y="310" font-family="monospace" font-size="6" fill="#3a3a5c">16</text>

  <!-- Closing lines with partial code -->
  <text x="148" y="202" font-family="monospace" font-size="7.5" fill="#89ddff" opacity="0.5">    &lt;/div&gt;</text>
  <text x="148" y="214" font-family="monospace" font-size="7.5" fill="#89ddff" opacity="0.5">  )</text>
  <text x="148" y="226" font-family="monospace" font-size="7.5" fill="#89ddff" opacity="0.4">{"}"}</text>

  <!-- Blinking cursor -->
  <rect x="148" y="237" width="6" height="10" rx="1" fill="#82aaff" class="cursor" filter="url(#softGlow)"/>

  <!-- Active line highlight -->
  <rect x="124" y="232" width="264" height="12" fill="#82aaff" opacity="0.05" rx="1"/>

  <!-- Status bar at bottom of editor -->
  <rect x="92" y="314" width="296" height="8" fill="#0a0a18"/>
  <rect x="96" y="316" width="40" height="4" rx="2" fill="#5c6bc0" opacity="0.7"/>
  <rect x="142" y="316" width="30" height="4" rx="2" fill="#3a3a5c" opacity="0.6"/>
  <rect x="348" y="316" width="36" height="4" rx="2" fill="#3a3a5c" opacity="0.6"/>

  <!-- Person sitting at desk -->
  <!-- Chair back -->
  <rect x="178" y="370" width="8" height="60" rx="4" fill="#222235"/>
  <!-- Person body -->
  <ellipse cx="235" cy="395" rx="28" ry="32" fill="url(#bodyGrad)"/>
  <!-- Head -->
  <circle cx="240" cy="355" r="22" fill="#e8b89a"/>
  <!-- Hair -->
  <ellipse cx="240" cy="342" rx="22" ry="14" fill="#2d1b0e"/>
  <rect x="218" y="342" width="8" height="16" rx="4" fill="#2d1b0e"/>
  <rect x="254" y="342" width="8" height="16" rx="4" fill="#2d1b0e"/>
  <!-- Eyes -->
  <ellipse cx="231" cy="358" rx="4" ry="4.5" fill="#fff"/>
  <ellipse cx="249" cy="358" rx="4" ry="4.5" fill="#fff"/>
  <circle cx="232" cy="359" r="2.5" fill="#3d2b1f"/>
  <circle cx="250" cy="359" r="2.5" fill="#3d2b1f"/>
  <!-- Glasses -->
  <rect x="224" y="354" width="12" height="9" rx="3" fill="none" stroke="#8892b0" stroke-width="1.5"/>
  <rect x="241" y="354" width="12" height="9" rx="3" fill="none" stroke="#8892b0" stroke-width="1.5"/>
  <line x1="236" y1="358" x2="241" y2="358" stroke="#8892b0" stroke-width="1.5"/>
  <line x1="224" y1="358" x2="220" y2="358" stroke="#8892b0" stroke-width="1.2"/>
  <line x1="253" y1="358" x2="257" y2="358" stroke="#8892b0" stroke-width="1.2"/>
  <!-- Nose -->
  <path d="M240 364 Q237 369 240 370 Q243 369 240 364" fill="#d4a080" stroke="none"/>
  <!-- Mouth - slight smile -->
  <path d="M233 374 Q240 378 247 374" stroke="#c07060" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="233" y="374" width="14" height="14" rx="5" fill="#e8b89a"/>
  <!-- Collar -->
  <path d="M210 388 Q235 380 260 388 Q255 395 235 393 Q215 395 210 388" fill="#3a3a6c"/>
  <!-- Shirt/Body -->
  <path d="M207 395 Q235 388 263 395 L270 430 Q235 440 200 430 Z" fill="#3a3a6c"/>
  <!-- Shoulders/Arms -->
  <!-- Left arm reaching to keyboard -->
  <path d="M210 400 Q175 415 165 435 Q162 440 168 442 Q174 440 178 435 Q190 418 215 408 Z" fill="#e8b89a"/>
  <!-- Right arm reaching to keyboard -->
  <path d="M263 400 Q295 415 305 435 Q308 440 302 442 Q296 440 292 435 Q280 418 258 408 Z" fill="#e8b89a"/>
  <!-- Hands on keyboard area -->
  <ellipse cx="175" cy="444" rx="11" ry="7" fill="#e8b89a"/>
  <ellipse cx="300" cy="444" rx="11" ry="7" fill="#e8b89a"/>

  <!-- Keyboard on desk -->
  <rect x="150" y="436" width="180" height="20" rx="4" fill="#1e1e30"/>
  <rect x="154" y="439" width="172" height="14" rx="3" fill="#252540"/>
  <!-- Keyboard keys suggestion -->
  <rect x="158" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="169" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="180" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="191" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="202" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="213" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="224" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="235" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="246" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="257" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="268" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="279" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <rect x="290" y="441" width="8" height="5" rx="1" fill="#1a1a2e" opacity="0.8"/>
  <!-- Space bar -->
  <rect x="185" y="448" width="110" height="4" rx="2" fill="#1a1a2e" opacity="0.8"/>

  <!-- Mouse -->
  <rect x="330" y="435" width="24" height="30" rx="10" fill="#252540"/>
  <line x1="342" y1="435" x2="342" y2="455" stroke="#1a1a2e" stroke-width="1.5"/>
  <ellipse cx="342" cy="446" rx="3" ry="2" fill="#5c6bc0" opacity="0.4"/>

  <!-- Floating tech tags -->
  <g class="tag1">
    <rect x="50" y="120" width="64" height="20" rx="10" fill="#5c6bc0" opacity="0.85"/>
    <text x="62" y="134" font-family="sans-serif" font-size="9" fill="white" font-weight="600">React</text>
  </g>

  <g class="tag2">
    <rect x="366" y="150" width="80" height="20" rx="10" fill="#26c6da" opacity="0.8"/>
    <text x="374" y="164" font-family="sans-serif" font-size="9" fill="white" font-weight="600">TypeScript</text>
  </g>

  <g class="tag3">
    <rect x="50" y="280" width="70" height="20" rx="10" fill="#ec407a" opacity="0.8"/>
    <text x="60" y="294" font-family="sans-serif" font-size="9" fill="white" font-weight="600">Next.js</text>
  </g>

  <!-- Floating particles (code sparks) -->
  <circle cx="130" cy="200" r="3" fill="#82aaff" opacity="0.7" class="particle1"/>
  <circle cx="355" cy="220" r="2.5" fill="#c3e88d" opacity="0.7" class="particle2"/>
  <circle cx="95" cy="250" r="2" fill="#c792ea" opacity="0.6" class="particle3"/>

  <!-- Coffee mug on desk -->
  <rect x="380" y="344" width="22" height="20" rx="3" fill="#2a2a3e"/>
  <rect x="382" y="346" width="18" height="16" rx="2" fill="#1a1a2e"/>
  <path d="M402 350 Q412 350 412 358 Q412 366 402 366" stroke="#2a2a3e" stroke-width="3" fill="none"/>
  <!-- Coffee steam -->
  <path d="M388 342 Q390 336 388 330" stroke="#82aaff" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
    <animate attributeName="d" values="M388 342 Q390 336 388 330;M388 342 Q392 334 390 328;M388 342 Q386 336 388 330" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M393 342 Q395 335 393 328" stroke="#82aaff" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round">
    <animate attributeName="d" values="M393 342 Q395 335 393 328;M393 342 Q391 333 393 326;M393 342 Q397 335 393 328" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Post-it notes on desk -->
  <rect x="50" y="352" width="36" height="30" rx="2" fill="#ffee58" opacity="0.85" transform="rotate(-3, 68, 367)"/>
  <line x1="56" y1="362" x2="82" y2="362" stroke="#f9a825" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="367" x2="78" y2="367" stroke="#f9a825" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="372" x2="80" y2="372" stroke="#f9a825" stroke-width="1" opacity="0.6"/>

  <!-- Screen reflection/glow at bottom of monitor -->
  <ellipse cx="240" cy="335" rx="120" ry="6" fill="#5c6bc0" opacity="0.07" class="float"/>
</svg>
